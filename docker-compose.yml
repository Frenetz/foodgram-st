version: '3.9'

services:
  db:
    image: postgres:14
    container_name: foodgram-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: frenetz/final_project_back:v4
    container_name: foodgram-back
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
      - ./data:/data
    restart: always

  frontend:
    image: frenetz/final_project_front:v1
    container_name: foodgram-front
    volumes:
      - frontend_build:/app/result_build/
    command: ""
    restart: "no"

  nginx:
    image: nginx:1.25.4-alpine
    container_name: foodgram-proxy
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/usr/share/nginx/html/
      - ./docs:/usr/share/nginx/html/api/docs/
      - static_value:/static/
      - media_value:/etc/nginx/html/media/
    restart: always

volumes:
  postgres_data:
  static_value:
  media_value:
  frontend_build:
